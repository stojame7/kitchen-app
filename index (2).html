<style>
:root {
  --bg: #fff6ed; --surface: #ffffff; --surface-2: #fbebdd;
  --ink: #111111; --muted: #6b7280; --line: #f0dfd0;
  --primary: #c8102e; --primary-ink: #ffffff; --primary-soft: #fce6e8;
  --accent: #c2410c; --accent-soft: #ffeedd;
  --primary-text: #b00e28;
  --shadow: 0 1px 2px rgba(20,23,26,.06), 0 4px 14px rgba(20,23,26,.05);
  --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0d; --surface: #171718; --surface-2: #232324; --ink: #fff6ed;
    --muted: #aaa4a0; --line: #2e2d2d;
    --primary: #d7142f; --primary-ink: #ffffff; --primary-soft: #3a1726;
    --accent: #ff8a3d; --accent-soft: #33283a;
    --primary-text: #ff4d5e;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0d; --surface: #171718; --surface-2: #232324; --ink: #fff6ed;
  --muted: #aaa4a0; --line: #2e2d2d;
  --primary: #d7142f; --primary-ink: #ffffff; --primary-soft: #3a1726;
  --accent: #ff8a3d; --accent-soft: #33283a;
  --primary-text: #ff4d5e;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.5; font-size: 16px; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.hidden { display: none !important; }

/* App bar */
.appbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding-top: env(safe-area-inset-top, 0px);
}
.appbar-inner { max-width: 760px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.lockup { height: 36px; width: auto; display: block; }
.logo-dark { display: none !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none !important; } :root:not([data-theme="light"]) .logo-dark { display: block !important; } }
:root[data-theme="dark"] .logo-light { display: none !important; }
:root[data-theme="dark"] .logo-dark { display: block !important; }
.tagline { margin-top: 10px; font-weight: 700; color: var(--primary-text); letter-spacing: .01em; }
.bar-actions { display: flex; gap: 6px; }
.icon-btn { height: 38px; min-width: 38px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }

main { max-width: 760px; margin: 0 auto; padding: 8px 18px 120px; }

/* Wizard */
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0 22px; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .35s ease; }
.step-count { font-size: 14px; color: var(--muted); font-weight: 600; }
.step h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
.step .lead { color: var(--muted); margin-top: 8px; font-size: 16px; max-width: 52ch; }
.step-body { margin-top: 22px; }
.subhead { font-size: 15px; font-weight: 700; margin: 22px 0 10px; }

.welcome { text-align: center; padding-top: 4vh; }
.welcome h1 { margin-top: 6px; }
.hero-logo { width: min(300px, 78vw); height: auto; margin: 0 auto 26px; }
.hero-logo.logo-light { display: block; }
.welcome h1 { font-size: clamp(32px, 8vw, 46px); }
.welcome .lead { margin: 12px auto 0; }
.welcome .perks { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
.welcome .perks li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card-opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 14px; width: 100%; transition: border-color .15s, background-color .15s;
}
.card-opt:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.card-opt[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
.card-opt .emo { width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; }
.card-opt[aria-pressed="true"] .emo { background: var(--surface); }
.card-opt .t { font-weight: 700; font-size: 16px; display: block; }
.card-opt .s { color: var(--muted); font-size: 14px; display: block; line-height: 1.35; margin-top: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 15px; }
.chip:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; cursor: pointer; }
.toggle-row .t { font-weight: 700; display: block; }
.toggle-row .s { color: var(--muted); font-size: 14px; display: block; }
.switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }

.stepper { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; width: fit-content; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 700; }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper output { min-width: 90px; text-align: center; font-size: 22px; font-weight: 800; }
.stepper output small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }

.input { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.input:focus { border-color: var(--primary); outline: none; }
.own-form { display: grid; gap: 12px; }
.own-list { list-style: none; display: grid; gap: 8px; margin-top: 16px; }
.own-list li { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.own-list .emo { font-size: 22px; }
.own-list .t { font-weight: 700; }
.own-list .s { color: var(--muted); font-size: 13px; }
.own-list .grow { flex: 1; }
.link-btn { color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px; }

.bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 18px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.bottom-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.btn { border-radius: 14px; padding: 14px 20px; font-weight: 700; font-size: 16px; }
.btn-primary { background: var(--primary); color: var(--primary-ink); flex: 1; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { opacity: .45; cursor: default; filter: none; }
.btn-secondary { background: var(--surface-2); }
.btn-secondary:hover { filter: brightness(0.97); }

/* Plan */
.plan-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.plan-top h1 { font-size: clamp(26px, 6vw, 32px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.plan-top p { color: var(--muted); font-size: 15px; }
.pref-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pref-summary span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }

.days { display: flex; gap: 8px; overflow-x: auto; padding: 16px 2px 10px; margin: 0 -2px; scrollbar-width: none; scroll-snap-type: x proximity; }
.days::-webkit-scrollbar { display: none; }
.day-pill { flex-shrink: 0; scroll-snap-align: start; width: 64px; padding: 10px 0; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; position: relative; }
.day-pill .dw { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.day-pill .dn { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; }
.day-pill .dot { position: absolute; top: 6px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.day-pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.day-pill[aria-pressed="true"] .dw, .day-pill[aria-pressed="true"] .dn { color: var(--bg); }

.day-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 12px; }
.day-title h2 { font-size: 20px; font-weight: 800; }
.badge { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 3px 10px; }

.meal-list { display: grid; gap: 12px; }
.meal { display: flex; gap: 14px; background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); transition: background-color .5s ease; align-items: flex-start; }
.meal.flash { background: var(--primary-soft); }
.meal .plate { width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 34px; background: var(--surface-2); box-shadow: inset 0 0 0 6px var(--surface); outline: 1px solid var(--line); }
.meal[data-slot="breakfast"] .plate, .meal[data-slot="suhoor"] .plate { background: var(--accent-soft); }
.meal[data-slot="lunch"] .plate, .meal[data-slot="iftar"] .plate { background: var(--primary-soft); }
.meal .info { flex: 1; min-width: 0; }
.meal .slot { font-size: 13px; font-weight: 700; color: var(--primary-text); letter-spacing: .02em; text-transform: uppercase; }
.meal[data-slot="breakfast"] .slot, .meal[data-slot="suhoor"] .slot { color: var(--accent); }
.meal .name { font-size: 18px; font-weight: 800; line-height: 1.25; margin-top: 1px; }
.meal .origin { font-size: 14px; color: var(--muted); }
.meal .why { font-size: 14.5px; margin-top: 6px; }
.meal .pre { font-size: 13px; color: var(--muted); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 2px 9px; }
.tag.own { background: var(--accent-soft); color: var(--accent); }
.swap { flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; }
.swap:hover { background: var(--primary-soft); color: var(--primary-text); }
.swap svg { width: 18px; height: 18px; }
.meal.empty .name { font-size: 16px; }

.tips { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin-top: 22px; }
.tips summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tips summary::-webkit-details-marker { display: none; }
.tips summary::after { content: "+"; font-size: 22px; color: var(--muted); line-height: 1; }
.tips[open] summary::after { content: "−"; }
.tips ul { padding: 0 16px 16px 34px; display: grid; gap: 6px; font-size: 15px; }
.fine { color: var(--muted); font-size: 13px; margin-top: 18px; text-align: center; }

.print-all { display: none; }

@media (prefers-reduced-motion: reduce) { .progress span, .meal, .switch .track, .switch .track::after { transition: none; } }

@media print {
  body { background: #fff; color: #000; }
  .appbar, main, .bottom-bar { display: none !important; }
  .print-all { display: block; padding: 0 8px; font-family: var(--font); }
  .print-all h1 { font-size: 22px; margin-bottom: 4px; }
  .print-all table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  .print-all th, .print-all td { border: 1px solid #999; padding: 6px; text-align: left; vertical-align: top; }
  .print-all tr { break-inside: avoid; }
}
</style>
</head>

        var list = pool(slot, s, rules), span = Math.min(4, Math.max(0, list.length - 2));
        var d = pick(list, used.concat(recentIds(plan, i, slot, span)));
        day.meals[slot] = d ? d.id : null; if (d) used.push(d.id);
      });
    }
    return plan;
  }
  function swap(di, slot) {
    var s = state.settings, day = state.plan[di], list = pool(slot, s, dayRules(s, dateFor(s, di)));
    var same = Object.keys(day.meals).map(function (k) { return day.meals[k]; });
    var near = recentIds(state.plan, di, slot, 2).concat(state.plan[di + 1] ? [state.plan[di + 1].meals[slot]] : []);
    var d = pick(list, same.concat(near));
    if (d && d.id === day.meals[slot] && list.length > 1) d = pick(list, [day.meals[slot]]);
    day.meals[slot] = d ? d.id : null;
    save(); renderPlan();
    var card = document.querySelector('.meal[data-slot="' + slot + '"]');
    if (card) { card.classList.add("flash"); setTimeout(function () { card.classList.remove("flash"); }, 600); var b = card.querySelector(".swap"); if (b) b.focus(); }
  }

  function notesFor(s) {
    var items = [];
    if (s.goal === "loss") items.push(
      "Fill half your plate with vegetables or soup greens, a quarter with protein, and a quarter with starch.",
      "Keep swallows (eba, pounded yam, fufu, ugali) to about the size of your fist.",
      "Choose grilled, boiled or steamed over fried, and go easy on oil in stews.",
      "Drink water before meals and swap sweet drinks for zobo or tea without sugar.");
    if (s.goal === "sugar") items.push(
      "Pair every starch with protein and vegetables so it digests more slowly.",
      "Beans, unripe plantain, fonio, millet and sorghum are gentler on blood sugar than white rice, white bread or ripe plantain.",
      "Keep portions of swallow and rice modest, and skip sugary drinks and fried snacks.",
      "If you have diabetes, follow the plan your doctor or dietitian gave you.");
    if (s.goal === "protein") items.push(
      "Include beans, lentils, eggs, fish, chicken or groundnuts at every meal.",
      "Spread protein across the day rather than saving it all for dinner.",
      "Snacks like boiled eggs, groundnuts and moi moi add up quickly.");
    if (s.religion === "muslim") items.push(s.ramadan ? "Break the fast with dates and water before your iftar meal, and choose slow-release foods at suhoor to last the day." : "Buy meat from halal sources. Pork dishes are left out of your timetable.");
    if (s.religion === "jewish") items.push("Pork and shellfish dishes are left out. Use kosher meat, and keep meat and dairy apart where your practice requires it.");
    if (s.religion === "hindu") items.push("Your timetable is vegetarian. Choose vegan if you also avoid eggs and dairy.");
    if (s.fasting === "orthodox") items.push("Wednesdays and Fridays are planned as vegan fast days.");
    return items;
  }

  function prefSummary(s) {
    var out = [];
    var r = REGIONS.filter(function (x) { return x[0] === s.region; })[0]; if (r) out.push(r[1]);
    if (s.culture) Object.keys(CULTURES).forEach(function (k) { CULTURES[k].forEach(function (c) { if (c[0] === s.culture) out.push(c[1]); }); });
    var f = FAITHS.filter(function (x) { return x[0] === s.religion; })[0]; if (f && s.religion !== "none") out.push(f[1] + (s.ramadan ? ", Ramadan" : ""));
    if (s.fasting !== "none") out.push(FASTS.filter(function (x) { return x[0] === s.fasting; })[0][1]);
    if (s.style !== "all") out.push(STYLES.filter(function (x) { return x[0] === s.style; })[0][1]);
    if (s.goal !== "none") out.push(GOALS.filter(function (x) { return x[0] === s.goal; })[0][1]);
    return out;
  }

  // ---------- plan view ----------
  var SWAP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H9a5 5 0 0 0-5 5"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h12a5 5 0 0 0 5-5"/></svg>';

  function renderPlan() {
    var s = state.settings, app = document.getElementById("app"); app.innerHTML = "";
    if (state.day >= state.plan.length) state.day = 0;

    var top = el("div", "plan-top"), tl = el("div");
    tl.appendChild(el("h1", null, s.days === 1 ? "Your meals for the day" : "Your " + s.days + "-day timetable"));
    var f = { day: "numeric", month: "short" };
    tl.appendChild(el("p", null, s.days === 1 ? dateFor(s, 0).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) : dateFor(s, 0).toLocaleDateString("en-GB", f) + " to " + dateFor(s, s.days - 1).toLocaleDateString("en-GB", f)));
    top.appendChild(tl);
    app.appendChild(top);
    var ps = el("div", "pref-summary"); prefSummary(s).forEach(function (t) { ps.appendChild(el("span", null, t)); });
    if (ps.childNodes.length) app.appendChild(ps);

    if (s.days > 1) {
      var days = el("div", "days"); days.setAttribute("role", "group"); days.setAttribute("aria-label", "Choose a day");
      state.plan.forEach(function (d, i) {
        var dt = dateFor(s, i), b = el("button", "day-pill"); b.type = "button";
        b.setAttribute("aria-pressed", i === state.day ? "true" : "false");
        b.setAttribute("aria-label", dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) + (d.note ? ", " + d.note : ""));
        b.appendChild(el("span", "dw", dt.toLocaleDateString("en-GB", { weekday: "short" })));
        b.appendChild(el("span", "dn", String(dt.getDate())));
        if (d.note) b.appendChild(el("span", "dot"));
        b.addEventListener("click", function () { state.day = i; save(); renderPlan(); var p = document.querySelector('.day-pill[aria-pressed="true"]'); if (p) p.focus(); });
        days.appendChild(b);
      });
      app.appendChild(days);
      setTimeout(function () { var p = days.querySelector('[aria-pressed="true"]'); if (p) days.scrollLeft = p.offsetLeft - 20; }, 0);
    }

    var day = state.plan[state.day], dt = dateFor(s, state.day);
    var th = el("div", "day-title");
    th.appendChild(el("h2", null, s.days > 1 ? dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) : "Your meals"));
    if (day.note) th.appendChild(el("span", "badge", day.note));
    app.appendChild(th);

    var list = el("div", "meal-list");
    Object.keys(day.meals).forEach(function (slot) {
      var d = day.meals[slot] ? findDish(day.meals[slot]) : null;
      var card = el("article", "meal" + (d ? "" : " empty")); card.setAttribute("data-slot", slot);
      card.appendChild(el("div", "plate", d ? (d.e || "🥘") : "🍽️"));
      var info = el("div", "info");
      info.appendChild(el("div", "slot", SLOT_LABEL[slot]));
      if (!d) {
        info.appendChild(el("h3", "name", "No dish fits all your choices"));
        info.appendChild(el("p", "why", "Edit preferences and turn on \"Mix in dishes from across Africa\", or add one of your own dishes."));
      } else {
        if (slot === "iftar") info.appendChild(el("p", "pre", "Open with dates and water, then"));
        info.appendChild(el("h3", "name", d.n));
        info.appendChild(el("p", "origin", d.c));
        info.appendChild(el("p", "why", d.b));
        var tags = el("div", "tags");
        if (d.own) tags.appendChild(el("span", "tag own", "Your dish"));
        ["vg", "v", "hp", "gi", "lt"].forEach(function (k) { if (d.f[k] && !(k === "v" && d.f.vg)) tags.appendChild(el("span", "tag", TAG_LABEL[k])); });
        if (tags.childNodes.length) info.appendChild(tags);
      }
      card.appendChild(info);
      var sw = el("button", "swap"); sw.type = "button"; sw.innerHTML = SWAP_ICON;
      sw.setAttribute("aria-label", "Swap " + SLOT_LABEL[slot].toLowerCase()); sw.title = "Swap for another dish";
      sw.addEventListener("click", function () { swap(state.day, slot); });
      card.appendChild(sw);
      list.appendChild(card);
    });
    app.appendChild(list);

    var notes = notesFor(s);
    if (notes.length) {
      var det = el("details", "tips"); if (s.goal !== "none") det.open = true;
      det.appendChild(el("summary", null, s.goal !== "none" ? "Diet tips for your goal" : "Good to know"));
      var ul = el("ul"); notes.forEach(function (t) { ul.appendChild(el("li", null, t)); }); det.appendChild(ul);
      app.appendChild(det);
    }
    app.appendChild(el("p", "fine", "Diet tips are general guidance, not medical advice."));

    var bar = document.getElementById("bottomInner"); bar.innerHTML = "";
    var pr = el("button", "btn btn-secondary", "Print"); pr.type = "button";
    pr.addEventListener("click", function () { buildPrint(); window.print(); });
    var again = el("button", "btn btn-primary", "New timetable"); again.type = "button";
    again.addEventListener("click", function () { state.plan = generate(state.settings); save(); renderPlan(); });
    bar.appendChild(pr); bar.appendChild(again);
    document.getElementById("bottomBar").classList.remove("hidden");
    document.getElementById("editBtn").classList.remove("hidden");
  }

  function buildPrint() {
    var s = state.settings, box = document.getElementById("printAll"); box.innerHTML = "";
    box.appendChild(el("h1", null, "MenuWeave: " + (s.days === 1 ? "meal plan" : s.days + "-day meal timetable")));
    box.appendChild(el("p", null, prefSummary(s).join(", ")));
    var slots = slotsFor(s), t = el("table"), hr = el("tr");
    hr.appendChild(el("th", null, "Day")); slots.forEach(function (x) { hr.appendChild(el("th", null, SLOT_LABEL[x])); });
    t.appendChild(hr);
    state.plan.forEach(function (d, i) {
      var tr = el("tr");
      tr.appendChild(el("td", null, dateFor(s, i).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + (d.note ? " (" + d.note + ")" : "")));
      slots.forEach(function (x) { var dish = d.meals[x] ? findDish(d.meals[x]) : null; tr.appendChild(el("td", null, dish ? dish.n : "")); });
      t.appendChild(tr);
    });
    box.appendChild(t);
  }

  document.getElementById("editBtn").addEventListener("click", function () {
    draft = JSON.parse(JSON.stringify(state.settings || defaults()));
    state.view = "wizard"; state.step = 1; render(); window.scrollTo(0, 0);
  });

  function render() { if (state.view === "plan" && state.plan && state.settings) renderPlan(); else renderWizard(); }

  // ---------- start ----------
  var saved = load();
  if (saved) {
    state.theme = saved.theme || "system";
    state.own = Array.isArray(saved.own) ? saved.own : [];
    state.own.forEach(function (d) { if (!d.e) d.e = emojiFor(d.n); });
    if (saved.settings && Array.isArray(saved.plan)) { state.settings = saved.settings; state.plan = saved.plan; state.view = "plan"; state.day = saved.day || 0; draft = JSON.parse(JSON.stringify(saved.settings)); }
  }
  applyTheme();
  render();
})();
</script>
